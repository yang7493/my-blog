<script>
  const startDate = new Date(2026, 7, 26);   // 2026-08-26
  const endDate   = new Date(2027, 1, 16);   // 2027-02-16
  const totalWorkDays = 117;

  const holidays = [
    "2026-09-24", "2026-09-25",
    "2026-10-05", "2026-10-09",
    "2026-12-25",
    "2027-01-01",
    "2027-02-08", "2027-02-09"
  ];

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function isWorkDay(d) {
    const dow = d.getDay(); // 0=일, 6=토
    if (dow === 0 || dow === 6) return false;
    if (holidays.includes(formatDate(d))) return false;
    return true;
  }

  function countWorkDays(from, to) {
    let count = 0;
    let d = new Date(from);
    while (d <= to) {
      if (isWorkDay(d)) count++;
      d.setDate(d.getDate() + 1);
    }
    return count;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const cappedToday = today > endDate ? endDate : today;

  const passedDays = countWorkDays(startDate, cappedToday);
  const percent = Math.min(100, Math.round((passedDays / totalWorkDays) * 100));

  document.getElementById("bootcamp-day").textContent = passedDays;
  document.getElementById("bootcamp-progress-bar").style.width = percent + "%";
  document.getElementById("bootcamp-progress-text").innerHTML =
    passedDays + " / " + totalWorkDays + "일 진행 (" + percent + "%) " +  '<span style="margin-left:150px;">🏃‍♀️</span>';
</script>

<script>
(function () {
  // 달력에 선으로 표시할 기간 (모듈)
  const modules = [
    { name: "MODULE 1", start: "2026-09-07", end: "2026-09-22", color: "#9c27b0" }
  ];

  // 대한민국 공휴일 (대체공휴일 포함)
  const publicHolidays = {
    "2026-01-01": "신정",
    "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
    "2026-03-01": "삼일절", "2026-03-02": "대체공휴일(삼일절)",
    "2026-05-05": "어린이날",
    "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일(부처님오신날)",
    "2026-06-03": "전국동시지방선거",
    "2026-06-06": "현충일",
    "2026-08-15": "광복절", "2026-08-17": "대체공휴일(광복절)",
    "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
    "2026-10-03": "개천절", "2026-10-05": "대체공휴일(개천절)",
    "2026-10-09": "한글날",
    "2026-12-25": "성탄절",
    "2027-01-01": "신정",
    "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일(설날)",
    "2027-03-01": "삼일절",
    "2027-05-05": "어린이날",
    "2027-05-13": "부처님오신날",
    "2027-06-06": "현충일",
    "2027-08-15": "광복절", "2027-08-16": "대체공휴일(광복절)",
    "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴",
    "2027-10-03": "개천절", "2027-10-04": "대체공휴일(개천절)",
    "2027-10-09": "한글날", "2027-10-11": "대체공휴일(한글날)",
    "2027-12-25": "성탄절", "2027-12-27": "대체공휴일(성탄절)"
  };

  fetch('{{ "/search.json" | relative_url }}?v={{ site.time | date: "%s" }}')
    .then(res => res.json())
    .then(posts => {
      const postsByDate = {};
      posts.forEach(p => {
        if (!postsByDate[p.date]) postsByDate[p.date] = [];
        postsByDate[p.date].push(p);
      });

      let current = new Date();

      function render() {
        const year = current.getFullYear();
        const month = current.getMonth();
        document.getElementById('cal-title').textContent = year + '년 ' + (month + 1) + '월';

        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '';

        ['일','월','화','수','목','금','토'].forEach((d, i) => {
          const el = document.createElement('div');
          el.textContent = d;
          el.style.fontWeight = 'bold';
          if (i === 0) el.style.color = '#e53935';
          if (i === 6) el.style.color = '#1e88e5';
          grid.appendChild(el);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          grid.appendChild(document.createElement('div'));
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          const cell = document.createElement('div');
          cell.textContent = d;
          cell.className = 'cal-day' + (postsByDate[dateStr] ? ' has-post' : '');
          const dow = new Date(year, month, d).getDay();
          if (dow === 6) cell.classList.add('saturday');
          if (dow === 0) cell.classList.add('sunday');
          if (publicHolidays[dateStr]) {
            cell.classList.add('holiday');
            cell.title = publicHolidays[dateStr];
          }
          const mod = modules.find(m => dateStr >= m.start && dateStr <= m.end);
          if (mod) {
            cell.classList.add('in-module');
            cell.style.setProperty('--module-color', mod.color);
            if (dateStr === mod.start) cell.classList.add('module-start');
            if (dateStr === mod.end) cell.classList.add('module-end');
            if (!cell.title) cell.title = mod.name;
          }
          if (postsByDate[dateStr]) {
            cell.addEventListener('click', () => showPosts(dateStr, cell));
          }
          grid.appendChild(cell);
        }

        renderModuleLegend(year, month);
      }

      function renderModuleLegend(year, month) {
        const first = year + '-' + String(month + 1).padStart(2, '0') + '-01';
        const lastDay = new Date(year, month + 1, 0).getDate();
        const last = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(lastDay).padStart(2, '0');

        const box = document.getElementById('cal-modules');
        box.innerHTML = modules
          .filter(m => m.start <= last && m.end >= first)
          .map(m => '<div class="cal-module-legend">' +
                      '<span class="bar" style="background:' + m.color + ';"></span>' +
                      '<span class="name" style="color:' + m.color + ';">' + m.name + '</span>' +
                      '<span>' + m.start.slice(5).replace('-', '.') + ' ~ ' + m.end.slice(5).replace('-', '.') + '</span>' +
                    '</div>')
          .join('');
      }

      function showPosts(dateStr, cellEl) {
        document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
        cellEl.classList.add('selected');

        const list = postsByDate[dateStr] || [];
        const container = document.getElementById('cal-posts');
        container.innerHTML = '<strong>' + dateStr + '</strong><ul style="padding-left:18px;margin:6px 0 0;">' +
          list.map(p => '<li><a href="' + p.url + '">' + p.title + '</a></li>').join('') +
          '</ul>';
      }

      document.getElementById('cal-prev').addEventListener('click', () => { current.setMonth(current.getMonth() - 1); render(); });
      document.getElementById('cal-next').addEventListener('click', () => { current.setMonth(current.getMonth() + 1); render(); });

      render();
    });
})();
</script>
