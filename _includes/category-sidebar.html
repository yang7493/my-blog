<style>
  #category-sidebar { font-size:14px; }
  .cs-card { border:1px solid #ddd; border-radius:8px; padding:14px 12px; background:#fff; }
  .cs-card + .cs-card { margin-top:16px; }
  .cs-title {
    margin:0 0 8px; padding:0 4px 8px; border-bottom:1px solid #eee;
    font-size:15px; font-weight:bold; color:#333;
  }
  .cs-list { list-style:none; margin:0; padding:0; }
  .cs-item {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; padding:7px 10px; margin:1px 0; border:none; border-radius:6px;
    background:none; font:inherit; color:#333; text-align:left; cursor:pointer;
  }
  .cs-item:hover { background:#f6eff8; }
  .cs-item.active { background:#f3e5f5; color:#7b1fa2; font-weight:bold; }
  .cs-item .cs-name { display:flex; align-items:center; gap:8px; }
  .cs-item .cs-dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .cs-item .cs-count { font-size:12px; color:#999; }
  .cs-item.active .cs-count { color:#7b1fa2; }

  .cs-profile-head { display:flex; align-items:center; gap:12px; padding:2px 4px 14px; }
  .cs-avatar {
    position:relative; flex:none; width:56px; height:56px; border-radius:50%; overflow:hidden;
    background:#f3e5f5; border:1px solid #eee;
  }
  .cs-avatar img { display:block; width:100%; height:100%; object-fit:cover; }
  .cs-avatar-fallback {
    display:none; width:100%; height:100%; align-items:center; justify-content:center;
    font-weight:bold; font-size:15px; color:#7b1fa2;
  }
  .cs-avatar.no-img .cs-avatar-fallback { display:flex; }
  .cs-profile-text { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .cs-profile-name { font-size:17px; color:#222; }
  .cs-github {
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:8px; border:1px solid #ddd; border-radius:6px;
    color:#333; font-size:14px; text-decoration:none;
  }
  .cs-github:hover { background:#f6eff8; border-color:#d9bde0; }
  .cs-stats {
    display:grid; grid-template-columns:1fr 1fr; margin:14px 0 0; padding-top:12px; border-top:1px solid #eee;
  }
  .cs-stats div { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .cs-stats div + div { border-left:1px solid #eee; }
  .cs-stats dt { font-size:12px; color:#888; }
  .cs-stats dd { margin:0; font-size:22px; font-weight:bold; color:#7b1fa2; font-variant-numeric:tabular-nums; }

  #filter-results { display:none; margin-bottom:32px; }
  #filter-results.show { display:block; }
  .fr-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .fr-header h2 { margin:0; }
  .fr-clear {
    border:1px solid #ddd; border-radius:6px; background:#fff;
    padding:4px 10px; font-size:13px; color:#555; cursor:pointer;
  }
  .fr-clear:hover { background:#f6eff8; }
  .fr-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  .fr-card {
    display:flex; flex-direction:column; gap:8px;
    border:1px solid #e5e5e5; border-radius:8px; padding:16px; background:#fff;
    text-decoration:none; color:inherit; transition:box-shadow .15s;
  }
  .fr-card:hover { box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .fr-badge {
    align-self:flex-start; padding:2px 8px; border-radius:10px;
    background:#f3e5f5; color:#7b1fa2; font-size:12px; font-weight:bold;
  }
  .fr-card-title { font-weight:bold; font-size:16px; line-height:1.4; color:#222; }
  .fr-card-excerpt {
    font-size:13px; line-height:1.5; color:#666;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .fr-card-meta { margin-top:auto; padding-top:8px; border-top:1px dashed #eee; font-size:12px; color:#999; }

  @media (max-width: 1200px) {
    #category-sidebar .cs-list { display:flex; flex-wrap:wrap; gap:4px; }
    #category-sidebar .cs-item { width:auto; gap:8px; border:1px solid #eee; }
  }
</style>

<aside id="category-sidebar" aria-label="프로필 및 글 분류">
  <div class="cs-card cs-profile">
    <div class="cs-profile-head">
      <span class="cs-avatar">
        <img src="https://github.com/yang7493.png?size=112" alt="양다연 프로필 사진" width="56" height="56"
             onerror="this.parentElement.classList.add('no-img'); this.remove();">
        <span class="cs-avatar-fallback" aria-hidden="true">다연</span>
      </span>
      <div class="cs-profile-text">
        <strong class="cs-profile-name">양다연</strong>
      </div>
    </div>
    <a class="cs-github" href="https://github.com/yang7493" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
    <dl class="cs-stats">
      <div><dt>글</dt><dd id="cs-stat-posts">-</dd></div>
      <div><dt>카테고리</dt><dd id="cs-stat-categories">-</dd></div>
    </dl>
  </div>
  <div class="cs-card">
    <h3 class="cs-title">카테고리</h3>
    <ul class="cs-list" id="cs-categories"></ul>
  </div>
  <div class="cs-card">
    <h3 class="cs-title">과정</h3>
    <ul class="cs-list" id="cs-modules"></ul>
  </div>
</aside>

<section id="filter-results" aria-live="polite">
  <header class="fr-header">
    <h2 id="fr-title"></h2>
    <button type="button" class="fr-clear" id="fr-clear">전체 글 보기 ✕</button>
  </header>
  <div class="fr-grid" id="fr-grid"></div>
</section>

<script>
(function () {
  const posts = [
    {% for post in site.posts %}
    {
      "title": {{ post.title | jsonify }},
      "url": {{ post.url | relative_url | jsonify }},
      "date": {{ post.date | date: '%Y-%m-%d' | jsonify }},
      "categories": {{ post.categories | jsonify }},
      "excerpt": {{ post.excerpt | strip_html | strip_newlines | truncate: 120 | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  const modules = {{ site.data.modules | jsonify }};
  const PRE_MODULE = { name: "사전 학습", color: "#9e9e9e" };

  // 글 날짜보다 시작일이 이른 모듈 중 가장 최근 모듈로 분류
  function moduleOf(date) {
    let found = PRE_MODULE;
    modules.forEach(m => { if (m.start <= date) found = m; });
    return found;
  }
  posts.forEach(p => { p.module = moduleOf(p.date).name; });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function countBy(keyFn) {
    const counts = {};
    posts.forEach(p => [].concat(keyFn(p)).forEach(k => { counts[k] = (counts[k] || 0) + 1; }));
    return counts;
  }

  const categoryCounts = countBy(p => p.categories);
  const categories = Object.keys(categoryCounts).sort((a, b) => a.localeCompare(b, 'en'));  // 영문 → 한글 순

  document.getElementById('cs-stat-posts').textContent = posts.length;
  document.getElementById('cs-stat-categories').textContent = categories.length;

  const moduleCounts = countBy(p => p.module);
  const moduleList = [PRE_MODULE].concat(modules).filter(m => moduleCounts[m.name]);

  function itemHtml(type, value, label, count, color) {
    const dot = color ? '<span class="cs-dot" style="background:' + color + ';"></span>' : '';
    return '<li><button type="button" class="cs-item" data-type="' + type + '" data-value="' + escapeHtml(value) + '">' +
             '<span class="cs-name">' + dot + escapeHtml(label) + '</span>' +
             '<span class="cs-count">' + count + '</span>' +
           '</button></li>';
  }

  document.getElementById('cs-categories').innerHTML =
    itemHtml('all', '', '전체 보기', posts.length) +
    categories.map(c => itemHtml('category', c, c, categoryCounts[c])).join('');

  document.getElementById('cs-modules').innerHTML =
    moduleList.map(m => itemHtml('module', m.name, m.name, moduleCounts[m.name], m.color)).join('');

  const results = document.getElementById('filter-results');
  // 테마의 '지금까지 쓴 글' 목록은 이 스크립트보다 뒤에 그려지므로 DOMContentLoaded 이후에 찾는다
  let postSection = null;

  function applyFilter(type, value) {
    document.querySelectorAll('.cs-item').forEach(el => {
      el.classList.toggle('active', el.dataset.type === type && el.dataset.value === (value || ''));
    });

    if (type === 'all' || !type) {
      results.classList.remove('show');
      if (postSection) postSection.style.display = '';
      return;
    }

    const matched = posts.filter(p => type === 'category' ? p.categories.includes(value) : p.module === value);
    document.getElementById('fr-title').textContent = value + ' (' + matched.length + '편)';
    document.getElementById('fr-grid').innerHTML = matched.map(p =>
      '<a class="fr-card" href="' + p.url + '">' +
        (p.categories.length ? '<span class="fr-badge">' + escapeHtml(p.categories[0]) + '</span>' : '') +
        '<span class="fr-card-title">' + escapeHtml(p.title) + '</span>' +
        '<span class="fr-card-excerpt">' + escapeHtml(p.excerpt) + '</span>' +
        '<span class="fr-card-meta">' + p.date.replace(/-/g, '.') + ' · ' + escapeHtml(p.module) + '</span>' +
      '</a>'
    ).join('');

    results.classList.add('show');
    if (postSection) postSection.style.display = 'none';
  }

  // URL 해시(#category=Java, #module=MODULE 2)로 필터 상태를 유지해 새로고침·뒤로가기·링크 공유가 가능하게 한다
  function readHash() {
    const m = decodeURIComponent(location.hash.slice(1)).match(/^(category|module)=(.+)$/);
    return m ? { type: m[1], value: m[2] } : { type: 'all', value: '' };
  }

  document.getElementById('category-sidebar').addEventListener('click', e => {
    const btn = e.target.closest('.cs-item');
    if (!btn) return;
    location.hash = btn.dataset.type === 'all' ? '' : btn.dataset.type + '=' + encodeURIComponent(btn.dataset.value);
  });

  document.getElementById('fr-clear').addEventListener('click', () => { location.hash = ''; });

  window.addEventListener('hashchange', () => {
    const f = readHash();
    applyFilter(f.type, f.value);
    if (results.classList.contains('show')) results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.addEventListener('DOMContentLoaded', () => {
    const entries = document.querySelector('.entries-list');
    postSection = entries ? entries.parentElement : null;
    // 필터 결과는 '지금까지 쓴 글' 목록 바로 위에 표시
    if (postSection) postSection.parentElement.insertBefore(results, postSection);

    const initial = readHash();
    applyFilter(initial.type, initial.value);
  });
})();
</script>
